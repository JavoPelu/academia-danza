<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Academia</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="page login-page">
        <div class="card login-card">
            <div class="brand">
                <div class="brand-logo">🩰</div>
                <h1>Academia Danza</h1>
                <p>Accede a tu panel de asistencia</p>
            </div>

            <form id="loginForm" onsubmit="login(event)" class="login-form">
                <label for="email">Usuario o correo</label>
                <input type="text" id="email" placeholder="admin@danza.com o 123456" required>

                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required>

                <button type="submit" class="primary-button">Ingresar</button>
                <div id="mensaje" class="mensaje"></div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
